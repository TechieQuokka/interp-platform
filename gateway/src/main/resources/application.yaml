spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/interp
    username: interp
    password: interp
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Each gateway instance has its own group and only cares about live traffic;
      # anything older is served by the replay path (ring buffer / Postgres).
      auto-offset-reset: latest

interp:
  gateway:
    instance-id: local
    listener-queue-capacity: 256
    ring-buffer-capacity: 1000
    max-db-replay: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        interp.e2e.latency: true
